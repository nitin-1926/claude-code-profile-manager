version: 2

project_name: ccpm

before:
  hooks:
    # Only download deps — never `go mod tidy`, which mutates go.sum/go.mod
    # non-deterministically and would make release builds non-reproducible.
    - sh -c "cd ccpm && go mod download"

builds:
  - dir: ccpm
    env:
      - CGO_ENABLED=0
    flags:
      # Strip absolute build paths so the binary is reproducible across machines.
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/nitin-1926/claude-code-profile-manager/ccpm/cmd.version={{.Version}}
    binary: ccpm

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

# Sign the checksums manifest with cosign in keyless (OIDC) mode. Because the
# whole release is verified against checksums.txt, signing that one file
# transitively attests every archive. `output: true` keeps the .sig/.pem as
# release assets. The signing only runs in CI where cosign + an OIDC token are
# present; local snapshot builds (`goreleaser release --snapshot`) skip signing,
# so a missing cosign won't break local builds.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    certificate: "${artifact}.pem"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: nitin-1926
    name: claude-code-profile-manager
