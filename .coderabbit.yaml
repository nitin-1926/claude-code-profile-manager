# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Repo-level CodeRabbit config. This file takes precedence over the dashboard
# settings, which is the point: the dashboard had a positive `auto_review.labels`
# filter, so PRs carrying none of those labels were skipped with
# "Review skipped: excluded by label configuration". Keeping the list empty here
# means every PR is reviewed regardless of labelling.

language: en-US

reviews:
  profile: chill
  # Post the walkthrough/summary as a review comment.
  high_level_summary: true
  review_status: true
  # Don't auto-approve; a human still merges.
  request_changes_workflow: false

  auto_review:
    enabled: true
    # EMPTY ON PURPOSE. A non-empty positive list restricts reviews to PRs
    # carrying one of those labels — that is what was silently skipping every PR
    # in this repo. Leave it empty so labelling never gates a review.
    labels: []
    # Drafts stay out: they are work in progress by definition.
    drafts: false
    # Empty = every base branch. This repo only merges into main today, but
    # pinning it would silently skip a future release branch.
    base_branches: []
    ignore_title_keywords: []

  # Generated and vendored files. Reviewing these produces noise about code
  # nobody writes by hand, and the wailsjs bindings alone are 22 tracked files
  # regenerated by `wails generate module`.
  path_filters:
    - "!ccpm/desktop/frontend/wailsjs/**"
    - "!ccpm/desktop/frontend/dist/**"
    - "!**/node_modules/**"
    - "!docs/.next/**"
    - "!**/*.min.js"
    - "!**/package-lock.json"

  path_instructions:
    - path: "ccpm/**/*.go"
      instructions: >-
        Go, no external linters beyond golangci-lint. Flag: anything under
        ccpm/desktop/** that is missing the `//go:build darwin` tag, since that
        directory is macOS-only and CI compiles it on one leg; nil slices in
        DTOs returned to the frontend (they marshal to null and blank the
        window — see desktop/services/nonnil_test.go); use of syscall.Exec,
        unix.*, or POSIX signal files outside a `//go:build !windows` file;
        and multi-file writes that bypass internal/atomicwrite.
    - path: "ccpm/internal/transcript/**"
      instructions: >-
        This package parses Claude Code's unversioned JSONL transcripts. Be
        strict about two things. First, token dedup MUST key on
        (message.id + requestId) with the largest snapshot winning, matching
        internal/usage/ingest.go — keying on the per-line `uuid` dedups nothing
        and inflates totals ~2x. Second, test fixtures must have shapes real
        transcripts actually produce: every line has a distinct uuid, and it is
        message.id that repeats across the lines of one response.
    - path: "ccpm/desktop/frontend/src/**/*.tsx"
      instructions: >-
        React 19 + Tailwind v4, no test runner (CI runs `tsc --noEmit` only).
        Flag: components that fetch without discarding responses from a
        superseded request, since switching profile mid-fetch can render one
        profile's data under another's header; use of the `useLive` hook in any
        tab whose service call writes under <profileDir>/usage, which loops via
        the fsnotify watcher; and missing error states — the house rule is
        error, then loading, then content.
    - path: "**/*_test.go"
      instructions: >-
        Check that a fixture's shape is one the real input actually produces. A
        test whose fixture is impossible passes while the bug ships.

  tools:
    golangci-lint:
      enabled: true

chat:
  auto_reply: true
