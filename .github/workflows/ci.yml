name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25.12']
    defaults:
      run:
        working-directory: ccpm

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: ccpm/go.sum

      - name: Build
        run: go build -o ccpm .

      # -race catches the cross-process/goroutine hazards the manifest and
      # sync paths are prone to; -count=1 defeats stale cache hits in CI.
      # The desktop (Wails) GUI is macOS-only and embeds a built frontend
      # (desktop/frontend/dist — gitignored and not built here), so exclude it
      # from CI tests; it is built and tested locally and at release time.
      - name: Test
        shell: bash
        run: go test -race -count=1 -coverprofile=cover.out $(go list ./... | grep -v '/desktop')

      # Floor set from the measured baseline (34.4% on 2026-06-10) minus a
      # small noise band. Ratchet upward as coverage improves — never down.
      - name: Coverage gate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          total="$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')"
          echo "total coverage: ${total}%"
          min=32
          if (( $(echo "$total < $min" | bc -l) )); then
            echo "::error::coverage ${total}% fell below the ${min}% floor" >&2
            exit 1
          fi

      - name: Verify binary runs
        run: ./ccpm --version
        shell: bash

  # The Wails frontend is 20+ TSX files that no other job compiles: Go tests
  # exclude /desktop, and the release workflow only builds it after a tag is
  # already pushed. Typecheck it on every PR so a break can't reach a release.
  desktop-frontend:
    name: Typecheck desktop frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ccpm/desktop/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ccpm/desktop/frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ccpm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: ccpm/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: latest
          working-directory: ccpm

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ccpm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: ccpm/go.sum

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  release-config:
    name: Validate release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: ccpm/go.sum

      # Catch a broken .goreleaser.yaml in CI instead of at tag time. Same
      # pinned action SHA + goreleaser version as release.yml.
      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          version: v2.4.6
          args: check

      # Assert the Go and npm versions stay in lockstep — install.js pins the
      # binary download to npm/package.json's version, so a drift would fetch a
      # mismatched (or non-existent) release asset.
      - name: Assert version parity (Go vs npm)
        run: |
          go_v="$(grep -E '^[[:space:]]*var[[:space:]]+version[[:space:]]*=' ccpm/cmd/root.go | sed -E 's/.*"([^"]+)".*/\1/')"
          npm_v="$(node -e 'console.log(require("./npm/package.json").version)')"
          echo "ccpm/cmd/root.go: $go_v"
          echo "npm/package.json: $npm_v"
          if [ "$go_v" != "$npm_v" ]; then
            echo "::error::version mismatch — Go says '$go_v', npm says '$npm_v'. Keep them in sync." >&2
            exit 1
          fi
