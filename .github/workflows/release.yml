name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Required for cosign keyless signing — lets goreleaser request an OIDC token
  # from GitHub's identity provider to sign checksums.txt against Fulcio/Rekor.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: ccpm/go.sum

      # Provides the `cosign` binary used by the goreleaser `signs` block to
      # keyless-sign the checksums manifest.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Provides `syft` for the goreleaser `sboms` block (per-archive SBOMs
      # published as release assets).
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Pin to a specific goreleaser-action SHA and goreleaser binary version
      # so a tag move or compromised label in the action repo can't silently
      # change what runs during a release.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          version: v2.4.6
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keyless (OIDC) signing for cosign.
          COSIGN_EXPERIMENTAL: '1'
