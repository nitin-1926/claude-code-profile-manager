name: Desktop Release

# The desktop app versions independently of the CLI: it ships on `desktop-v*`
# tags (the CLI uses `v*`), so the two release pipelines never trigger each other.
on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish CCPM Desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Don't leave the GITHUB_TOKEN in git config for later steps (this job
          # has contents: write, and `wails build` runs third-party build scripts).
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.13'
          # No build cache on a contents:write release job — avoid cache poisoning.
          cache: false

      # macos-latest ships Node, which Wails uses to build the frontend.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build per-arch .dmg + .app.zip + checksums
        run: bash scripts/build-desktop-dmg.sh "${GITHUB_REF_NAME}"

      - name: Write release notes
        run: |
          cat > /tmp/desktop-notes.md <<'EOF'
          Native desktop app for managing Claude Code profiles.

          ### Install
          Recommended, one line in Terminal (picks your chip, verifies the checksum, installs to Applications):

          ```sh
          curl -fsSL https://raw.githubusercontent.com/nitin-1926/claude-code-profile-manager/main/scripts/install-desktop.sh | sh
          ```

          Or download the `.dmg` for your Mac, **Apple Silicon** (`arm64`) or **Intel** (`amd64`), and drag **CCPM** into **Applications**. The app is ad-hoc signed but not notarized (that needs a paid Apple Developer ID), so macOS refuses a browser-downloaded copy and on macOS 15 and later calls it **"damaged"**. It is not. Clear the download flag once, then open it normally:

          ```sh
          xattr -dr com.apple.quarantine /Applications/CCPM.app
          ```

          Either way it is a one-time step: updates install themselves from inside the app, with no prompt.

          The app uses the `ccpm` CLI for write actions; install it from the [README](https://github.com/nitin-1926/claude-code-profile-manager#install) if you haven't.
          EOF

      # --latest=false: CLI and desktop releases share one list, and GitHub's
      # "Latest" badge is what /releases/latest resolves to. A desktop release
      # holding it broke the CLI's curl installer and `ccpm version
      # --check-latest`, both of which expect a v* tag there.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#desktop-v}"
          gh release create "${GITHUB_REF_NAME}" \
            ccpm/desktop/dist/*.dmg \
            ccpm/desktop/dist/*.app.zip \
            ccpm/desktop/dist/checksums.txt \
            --title "CCPM Desktop v${VER}" \
            --notes-file /tmp/desktop-notes.md \
            --latest=false
